<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP Proxy</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --border: #e2e5ea; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #16a34a; --err: #dc2626; --off: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #1a1f26; --text: #e5e8ec; --muted: #8b94a1;
      --border: #2a3138; --accent: #3b82f6; --ok: #22c55e; --err: #f87171; --off: #6b7280;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  h1 small { color: var(--muted); font-weight: normal; font-size: .85rem; margin-left: .6rem; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem; margin-bottom: 1.25rem;
  }
  form.add { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; }
  form.add label { display: flex; flex-direction: column; gap: .25rem; font-size: .78rem; color: var(--muted); }
  input, select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: .45rem .6rem; font: inherit; width: 8.5rem;
  }
  select { width: auto; }
  input.num { width: 6rem; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    border: 1px solid var(--border); border-radius: 6px; padding: .45rem .9rem;
    font: inherit; cursor: pointer; background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  button:hover { filter: brightness(1.08); }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; white-space: nowrap; }
  th, td { text-align: left; padding: .55rem .75rem; border-bottom: 1px solid var(--border); }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  td input.num { width: 5.2rem; }
  .route { font-family: ui-monospace, Menlo, monospace; font-size: .85rem; }
  .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: .4rem; }
  .running .dot { background: var(--ok); }
  .stopped .dot { background: var(--off); }
  .error .dot { background: var(--err); }
  .status { font-size: .85rem; }
  .status .why { color: var(--err); font-size: .75rem; display: block; white-space: normal; max-width: 16rem; }
  .stats { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); text-align: center; padding: 2rem 0; }
  #toast {
    position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
    background: var(--err); color: #fff; padding: .55rem 1rem; border-radius: 8px;
    opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>TCP Proxy <small>simulate latency between clients and TCP services</small></h1>

  <div class="panel">
    <form class="add" id="addForm">
      <label>Name <input name="name" placeholder="optional"></label>
      <label>Listen port <input name="listenPort" class="num" type="number" min="1" max="65535" required></label>
      <label>Target host <input name="targetHost" placeholder="host or IP" required></label>
      <label>Target port <input name="targetPort" class="num" type="number" min="1" max="65535" required></label>
      <label>Latency (ms) <input name="latencyMs" class="num" type="number" min="0" value="0"></label>
      <label>Jitter (ms) <input name="jitterMs" class="num" type="number" min="0" value="0"></label>
      <label title="Percentage of chunks delayed by a simulated retransmit. Data is never discarded.">Loss (%) <input name="lossPercent" class="num" type="number" min="0" max="100" step="0.1" value="0"></label>
      <label title="Close connections with no traffic for this long. 0 disables.">Idle close (s) <input name="idleTimeoutSeconds" class="num" type="number" min="0" value="0"></label>
      <label title="FIN: peer reads end-of-file. RST: peer's read fails with a reset.">On idle
        <select name="idleAction">
          <option value="Close">FIN (close)</option>
          <option value="Reset">RST now</option>
          <option value="ResetOnUse">RST on next use</option>
          <option value="Blackhole">Black hole</option>
        </select>
      </label>
      <button class="primary" type="submit">Add proxy</button>
    </form>
  </div>

  <div class="panel tablewrap">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Route</th><th>Latency (ms)</th><th>Jitter (ms)</th><th>Loss (%)</th>
          <th>Idle close (s)</th><th>On idle</th>
          <th>Status</th><th>Traffic</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No proxies yet — add one above.</div>
  </div>
</main>
<div id="toast"></div>

<script>
const rowsEl = document.getElementById('rows');
const emptyEl = document.getElementById('empty');
let proxies = [];

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 4000);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || res.statusText);
  return data;
}

function bytes(n) {
  if (n < 1024) return n + ' B';
  const units = ['KiB', 'MiB', 'GiB', 'TiB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
  return n.toFixed(1) + ' ' + units[i];
}

function render() {
  emptyEl.hidden = proxies.length > 0;
  const focused = document.activeElement;
  for (const id of [...rowsEl.children].map(r => r.dataset.id)) {
    if (!proxies.some(p => p.id === id)) rowsEl.querySelector(`tr[data-id="${id}"]`).remove();
  }
  for (const p of proxies) {
    let tr = rowsEl.querySelector(`tr[data-id="${p.id}"]`);
    if (!tr) {
      tr = document.createElement('tr');
      tr.dataset.id = p.id;
      tr.innerHTML = `
        <td class="name"></td>
        <td class="route"></td>
        <td><input class="num" type="number" min="0" data-field="latencyMs"></td>
        <td><input class="num" type="number" min="0" data-field="jitterMs"></td>
        <td><input class="num" type="number" min="0" max="100" step="0.1" data-field="lossPercent"></td>
        <td><input class="num" type="number" min="0" data-field="idleTimeoutSeconds" title="0 disables"></td>
        <td><select data-field="idleAction" title="FIN: peer reads end-of-file. RST now: peer's next write fails. RST on next use: write succeeds, read is reset. Black hole: peer hangs.">
          <option value="Close">FIN</option>
          <option value="Reset">RST now</option>
          <option value="ResetOnUse">RST on use</option>
          <option value="Blackhole">Black hole</option>
        </select></td>
        <td class="status"><span class="dot"></span><span class="label"></span><span class="why"></span></td>
        <td class="stats"></td>
        <td>
          <button data-act="toggle"></button>
          <button data-act="delete" class="danger">Delete</button>
        </td>`;
      tr.querySelectorAll('[data-field]').forEach(el => {
        el.addEventListener('change', () => update(p.id, {
          [el.dataset.field]: el.tagName === 'SELECT' ? el.value : (+el.value || 0),
        }));
      });
      tr.querySelector('[data-act=toggle]').addEventListener('click', () => {
        const cur = proxies.find(x => x.id === p.id);
        update(p.id, { enabled: !cur.enabled });
      });
      tr.querySelector('[data-act=delete]').addEventListener('click', async () => {
        try { await api('DELETE', `/api/proxies/${p.id}`); refresh(); }
        catch (e) { toast(e.message); }
      });
      rowsEl.appendChild(tr);
    }
    tr.querySelector('.name').textContent = p.name;
    tr.querySelector('.route').textContent = `:${p.listenPort} → ${p.targetHost}:${p.targetPort}`;
    for (const el of tr.querySelectorAll('[data-field]')) {
      if (el !== focused) el.value = p[el.dataset.field];
    }
    const state = p.error ? 'error' : (p.running ? 'running' : 'stopped');
    tr.querySelector('.status').className = 'status ' + state;
    tr.querySelector('.status .label').textContent =
      state === 'running' ? `running · ${p.activeConnections} conn` : state;
    tr.querySelector('.status .why').textContent = p.error || '';
    const extra = [];
    if (p.retransmits) extra.push(`${p.retransmits} retx`);
    if (p.idleClosed) extra.push(`${p.idleClosed} idle-closed`);
    tr.querySelector('.stats').textContent =
      `${p.totalConnections} conns · ↑ ${bytes(p.bytesUp)} · ↓ ${bytes(p.bytesDown)}`
      + (extra.length ? ' · ' + extra.join(' · ') : '');
    tr.querySelector('[data-act=toggle]').textContent = p.enabled ? 'Disable' : 'Enable';
  }
}

async function update(id, patch) {
  const p = proxies.find(x => x.id === id);
  if (!p) return;
  try {
    await api('PUT', `/api/proxies/${id}`, { ...p, ...patch });
    await refresh();
  } catch (e) {
    toast(e.message);
    render(); // revert the input to server state
  }
}

async function refresh() {
  try {
    proxies = await api('GET', '/api/proxies');
    render();
  } catch { /* server briefly unreachable; keep last state */ }
}

document.getElementById('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await api('POST', '/api/proxies', {
      name: f.get('name'),
      listenPort: +f.get('listenPort'),
      targetHost: f.get('targetHost'),
      targetPort: +f.get('targetPort'),
      latencyMs: +f.get('latencyMs') || 0,
      jitterMs: +f.get('jitterMs') || 0,
      lossPercent: +f.get('lossPercent') || 0,
      idleTimeoutSeconds: +f.get('idleTimeoutSeconds') || 0,
      idleAction: f.get('idleAction'),
      enabled: true,
    });
    e.target.reset();
    await refresh();
  } catch (err) {
    toast(err.message);
  }
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
